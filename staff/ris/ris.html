<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediTrack | My Requests</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../admin/main.css" />
  <style>
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-3);
      display: none;
    }
    .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; }
    .empty-state p { font-size: .9rem; }

    /* RIS items list inside view modal */
    .ris-item-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 13px;
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .ris-item-name { font-size: .88rem; font-weight: 700; color: var(--text-1); }
    .ris-item-qty  {
      font-size: .84rem; font-weight: 700;
      color: var(--maroon);
      background: var(--maroon-glow);
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* Status pill overrides for RIS */
    .status-pending   { background: rgba(246,172,2,.15);  color: var(--yellow-dark); }
    .status-approved  { background: var(--green-bg);       color: var(--green);       }
    .status-delivered { background: rgba(29,78,216,.12);   color: #1d4ed8;            }
    .status-rejected  { background: rgba(183,28,28,.12);   color: #b71c1c;            }

    /* View modal */
    .mt-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,20,.55); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; }
    .mt-modal-overlay.show { display: flex; }
    .mt-modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 24px;
      width: 100%; max-width: 480px;
      margin: 16px;
      box-shadow: var(--shadow-lg);
      animation: fadeUp .28s cubic-bezier(.34,1.2,.64,1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .mt-modal h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.1rem; font-weight: 800;
      color: var(--text-1); margin-bottom: 4px;
    }
    .modal-sub { font-size: .82rem; color: var(--text-3); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-modal-cancel {
      flex: 1; padding: 11px;
      background: var(--bg); color: var(--text-2);
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: .9rem; font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer; transition: var(--transition);
    }
    .btn-modal-cancel:hover { background: var(--border-light); }
    .view-modal-close {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; color: var(--text-3);
      background: var(--bg); border: 1.5px solid var(--border);
      cursor: pointer; transition: var(--transition); flex-shrink: 0;
    }
    .view-modal-close:hover { background: rgba(192,57,43,.1); color: #c0392b; border-color: #c0392b; }
  </style>
  <script src="../../js/auth.js"></script>
  <script>checkAuth('staff', '../../index.html');</script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">

  <!-- SIDEBAR -->
  <!-- SIDEBAR -->
  <div id="sidebarMount"></div>
  <!-- /sidebar -->


  <!-- TOP NAVBAR -->
  <header class="top-navbar" id="topNavbar">
    <div class="navbar-left">
      <button class="btn-menu-toggle" id="menuToggle" aria-label="Toggle Sidebar">
        <i class="bi bi-list"></i>
      </button>
      <div class="navbar-page-info">
        <div class="page-title">My Requests</div>
        <div class="page-crumb">
          <i class="bi bi-house-fill" style="font-size:.68rem;"></i>
          &nbsp;Home &rsaquo; My Requests
        </div>
      </div>
    </div>
    <div class="navbar-right">
      <div class="navbar-user" tabindex="0">
        <div class="user-avatar-nav user-avatar"></div>
        <div class="user-text">
          <span class="user-name-nav user-name"></span>
          <span class="user-role-nav user-role"></span>
        </div>
        
      </div>
    </div>
  </header>
  <!-- /top-navbar -->


  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">

    <!-- Toolbar -->
    <div class="page-toolbar au d1">
      <div class="toolbar-left">
        <div class="page-search">
          <i class="bi bi-search"></i>
          <input type="search" id="searchInput" placeholder="Search by request ID or date…" />
        </div>
        <select class="filter-select" id="statusFilter">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="delivered">Delivered</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="toolbar-right">
        <a href="../cart/cart.html" class="btn-secondary-mt" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;">
          <i class="bi bi-cart-plus-fill"></i> New Request
        </a>
      </div>
    </div>

    <!-- Requests Table -->
    <div class="card-panel au d2">
      <div class="tbl-header" style="margin-bottom:18px;">
        <h3>
          <i class="bi bi-file-earmark-text-fill" style="color:var(--maroon);margin-right:8px;"></i>
          Restock Requests
        </h3>
        <span id="risCount" style="font-size:.8rem;color:var(--text-3);font-weight:600;"></span>
      </div>
      <div class="table-responsive">
        <table class="medi-table" id="risTable" aria-label="My Restock Requests">
          <thead>
            <tr>
              <th>Request ID</th>
              <th>Date</th>
              <th>Items</th>
              <th>Status</th>
              <th>View</th>
            </tr>
          </thead>
          <tbody id="risBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState">
          <i class="bi bi-file-earmark-text"></i>
          <p>No requests found. Submit a request from the Cart page.</p>
        </div>
      </div>
    </div>

  </main>
  <!-- /main-content -->

</div>
<!-- /app wrapper -->


<!-- VIEW REQUEST MODAL -->
<div class="mt-modal-overlay" id="viewModal">
  <div class="mt-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <h2><i class="bi bi-file-earmark-text-fill" style="color:var(--maroon);margin-right:8px;"></i>Request Details</h2>
      <button class="view-modal-close" onclick="closeViewModal()" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <p class="modal-sub" id="viewModalSub">—</p>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">
      <div style="background:var(--bg);border:1px solid var(--border-light);border-radius:10px;padding:12px;">
        <div style="font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Request ID</div>
        <div style="font-size:.95rem;font-weight:700;color:var(--text-1);" id="viewRisId">—</div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border-light);border-radius:10px;padding:12px;">
        <div style="font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Status</div>
        <div id="viewRisStatus">—</div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border-light);border-radius:10px;padding:12px;">
        <div style="font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Date</div>
        <div style="font-size:.88rem;font-weight:600;color:var(--text-2);" id="viewRisDate">—</div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border-light);border-radius:10px;padding:12px;">
        <div style="font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Requested By</div>
        <div style="font-size:.88rem;font-weight:600;color:var(--text-2);" id="viewRisBy">—</div>
      </div>
    </div>

    <div id="viewRisRejectWrap" style="display:none;background:rgba(183,28,28,.07);border:1px solid rgba(183,28,28,.18);border-radius:10px;padding:12px;margin-bottom:12px;">
      <div style="font-size:.7rem;font-weight:800;color:#b71c1c;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Rejection Reason</div>
      <div style="font-size:.88rem;font-weight:600;color:#b71c1c;" id="viewRisRejectText">—</div>
    </div>

    <div style="font-size:.75rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;">
      Items Requested
    </div>
    <div id="viewRisItems" style="max-height:220px;overflow-y:auto;padding-right:2px;">
      <!-- Populated by JS -->
    </div>

    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeViewModal()">
        <i class="bi bi-x"></i> Close
      </button>
    </div>
  </div>
</div>


<div class="toast-stack" id="toastStack"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" crossorigin="anonymous"></script>
<script src="../sidebar.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/global.js"></script>

<script>
let allRequests = [];


// ── Status pill HTML ──────────────────────────────────────────────────────────

function statusPill(status) {
  const s = (status || 'pending').toLowerCase();
  const map = {
    pending:   { cls: 'status-pending',   label: 'Pending'   },
    approved:  { cls: 'status-approved',  label: 'Approved'  },
    delivered: { cls: 'status-delivered', label: 'Delivered' },
    rejected:  { cls: 'status-rejected',  label: 'Rejected'  },
  };
  const cfg = map[s] || map.pending;
  return `<span class="pill ${cfg.cls}">${cfg.label}</span>`;
}

// ── Render table ──────────────────────────────────────────────────────────────

function renderTable(data) {
  const tbody   = document.getElementById('risBody');
  const empty   = document.getElementById('emptyState');
  const countEl = document.getElementById('risCount');

  countEl.textContent = `${data.length} request${data.length !== 1 ? 's' : ''}`;

  if (!data.length) {
    tbody.innerHTML     = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = data.map(r => {
    const date     = new Date(r.created_at).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
    const itemCount = Array.isArray(r.items) ? r.items.length : '—';
    const s = (r.status || '').toLowerCase();
    const canExport = s === 'approved' || s === 'delivered' || s === 'completed';
    return `<tr>
      <td style="font-weight:700;color:var(--text-1);">RIS-${String(r.id).padStart(4, '0')}</td>
      <td class="td-date">${date}</td>
      <td class="td-qty">${itemCount}</td>
      <td>${statusPill(r.status)}</td>
      <td>
        <div style="display:flex;gap:6px;">
          <button class="btn-tbl" onclick="openViewModal(${r.id})"
                  style="background:rgba(37,99,235,.08);color:#1d4ed8;border:1.5px solid rgba(37,99,235,.18);"
                  title="View details">
            <i class="bi bi-eye-fill"></i> View
          </button>
          ${canExport ? `<button class="btn-tbl" onclick="generateRISPdf(${r.id})" style="background:rgba(183,28,28,.08);color:#b71c1c;border:1.5px solid rgba(183,28,28,.18);" title="Export PDF"><i class="bi bi-file-pdf-fill"></i> Export PDF</button>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── Filters ───────────────────────────────────────────────────────────────────

function applyFilters() {
  const q    = document.getElementById('searchInput').value.toLowerCase();
  const stat = document.getElementById('statusFilter').value.toLowerCase();

  const filtered = allRequests.filter(r => {
    const idStr  = `ris-${String(r.id).padStart(4, '0')}`;
    const date   = new Date(r.created_at).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' }).toLowerCase();
    const status = (r.status || 'pending').toLowerCase();
    return (!q    || idStr.includes(q) || date.includes(q)) &&
           (!stat || status === stat);
  });
  renderTable(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);

// ── View Modal ────────────────────────────────────────────────────────────────

function openViewModal(id) {
  const r = allRequests.find(x => x.id === id);
  if (!r) return;

  const date = new Date(r.created_at).toLocaleDateString('en-PH', {
    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
  });

  document.getElementById('viewModalSub').textContent   = `Submitted on ${date}`;
  document.getElementById('viewRisId').textContent      = `RIS-${String(r.id).padStart(4, '0')}`;
  document.getElementById('viewRisDate').textContent    = date;
  document.getElementById('viewRisBy').textContent      = r.requested_by || '—';
  document.getElementById('viewRisStatus').innerHTML    = statusPill(r.status);

  const rejectWrap = document.getElementById('viewRisRejectWrap');
  if (r.status === 'rejected' && r.reject_reason) {
    document.getElementById('viewRisRejectText').textContent = r.reject_reason;
    rejectWrap.style.display = '';
  } else {
    rejectWrap.style.display = 'none';
  }

  const itemsEl = document.getElementById('viewRisItems');
  if (Array.isArray(r.items) && r.items.length) {
    itemsEl.innerHTML = r.items.map(item => `
      <div class="ris-item-row">
        <span class="ris-item-name">${item.medicine_name || item.name || '—'}</span>
        <span class="ris-item-qty">${item.quantity} ${item.unit || 'pcs'}</span>
      </div>
    `).join('');
  } else {
    itemsEl.innerHTML = `<p style="color:var(--text-3);font-size:.85rem;padding:8px 0;">No item details available.</p>`;
  }

  document.getElementById('viewModal').classList.add('show');
}

function closeViewModal() {
  document.getElementById('viewModal').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewModal();
});

// ── Load data ─────────────────────────────────────────────────────────────────

async function loadRequests() {
  try {
    const res  = await fetch(`${API}/ris`);
    const data = await res.json();

    const storedU = JSON.parse(localStorage.getItem('user') || 'null');
    const myName  = storedU ? (storedU.name || storedU.username || '') : '';
    allRequests = Array.isArray(data) ? (myName ? data.filter(r => r.requested_by === myName) : data) : [];

    applyFilters();
  } catch (err) {
    console.error('Failed to load requests:', err);
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').querySelector('p').textContent =
      'Could not load requests. Please check your connection.';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────

function showToast(title, msg, type = 's') {
  const icons = { s: 'bi-check-circle-fill', w: 'bi-exclamation-circle-fill', e: 'bi-x-circle-fill' };
  const stack = document.getElementById('toastStack');
  const el    = document.createElement('div');
  el.className = 'toast-item';
  el.innerHTML = `
    <div class="toast-ico ${type}"><i class="bi ${icons[type]}"></i></div>
    <div class="toast-body"><strong>${title}</strong><p>${msg}</p></div>
    <button class="toast-close" onclick="this.closest('.toast-item').remove()"><i class="bi bi-x"></i></button>
  `;
  stack.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 4000);
}

// ── PDF Export ────────────────────────────────────────────────────────────────

function fmtRisDate(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function generateRISPdf(id) {
  try {
    const res = await fetch(`${API}/ris/${id}`);
    if (!res.ok) throw new Error();
    const r = await res.json();

    const { jsPDF } = window.jspdf;
    const doc    = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW  = doc.internal.pageSize.getWidth();
    const pageH  = doc.internal.pageSize.getHeight();
    const margin = 18;
    const cW     = pageW - margin * 2;
    let y = 0;

    doc.setFillColor(123, 29, 30);
    doc.rect(0, 0, pageW, 40, 'F');

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.setTextColor(255, 255, 255);
    doc.text('MediTrack Clinic', pageW / 2, 15, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(240, 210, 210);
    doc.text('Requisition and Issue Slip (RIS)', pageW / 2, 24, { align: 'center' });

    doc.setFontSize(8);
    doc.setTextColor(210, 175, 175);
    doc.text('Clinic · Pampanga State University', pageW / 2, 32, { align: 'center' });

    y = 52;

    const divX = margin + cW * 0.54;
    const boxH = 38;

    doc.setDrawColor(210, 210, 210);
    doc.setLineWidth(0.35);
    doc.roundedRect(margin, y - 6, cW, boxH, 2, 2, 'S');
    doc.setDrawColor(220, 220, 220);
    doc.line(divX, y - 6, divX, y - 6 + boxH);

    const leftRows  = [
      ['Entity Name:', 'MediTrack Clinic'],
      ['Office:',      'Clinic'],
      ['Purpose:',     'Restocking of medicines'],
    ];
    const rightRows = [
      ['RIS No.:',      `#${r.id}`],
      ['Date:',         fmtRisDate(r.created_at)],
      ['Requested By:', r.requested_by || '—'],
    ];

    leftRows.forEach(([lbl, val], i) => {
      const ry = y + i * 10;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(130, 80, 80);
      doc.text(lbl, margin + 4, ry);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(30, 30, 30);
      doc.text(String(val), margin + 38, ry);
    });

    const rX = divX + 5;
    rightRows.forEach(([lbl, val], i) => {
      const ry = y + i * 10;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(130, 80, 80);
      doc.text(lbl, rX, ry);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(30, 30, 30);
      doc.text(String(val), rX + 30, ry);
    });

    y += boxH + 4;

    const statusColors = {
      approved:  [22, 163, 74],
      delivered: [29, 78, 216],
      rejected:  [220, 38, 38],
      pending:   [201, 140, 0],
    };
    const sColor = statusColors[(r.status || '').toLowerCase()] || statusColors.pending;
    doc.setFillColor(...sColor);
    doc.roundedRect(margin, y, 34, 7, 1.5, 1.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(255, 255, 255);
    doc.text((r.status || 'pending').toUpperCase(), margin + 17, y + 5, { align: 'center' });

    y += 14;

    const items = r.items || [];

    if (typeof doc.autoTable === 'function') {
      doc.autoTable({
        startY: y,
        margin: { left: margin, right: margin },
        head: [['#', 'Medicine Name', 'Qty', 'Unit']],
        body: items.length
          ? items.map((item, idx) => [idx + 1, item.medicine_name || `Medicine #${item.medicine_id}`, item.quantity, item.unit || '—'])
          : [['', 'No items found.', '', '']],
        styles: { font: 'helvetica', fontSize: 9, cellPadding: { top: 4, right: 4, bottom: 4, left: 4 }, lineColor: [210, 210, 210], lineWidth: 0.3, textColor: [30, 30, 30], valign: 'middle' },
        headStyles: { fillColor: [123, 29, 30], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8.5, halign: 'center' },
        columnStyles: { 0: { cellWidth: 13, halign: 'center' }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 22, halign: 'center' }, 3: { cellWidth: 26, halign: 'center' } },
        alternateRowStyles: { fillColor: [253, 250, 250] },
        tableLineColor: [200, 200, 200],
        tableLineWidth: 0.3,
      });
      y = doc.lastAutoTable.finalY + 14;
    } else {
      const colW = [13, cW - 13 - 22 - 26, 22, 26];
      const colX = [margin, margin + 13, margin + 13 + colW[1], margin + 13 + colW[1] + 22];
      const rH   = 8;
      const hdrs = ['#', 'Medicine Name', 'Qty', 'Unit'];
      doc.setFillColor(123, 29, 30); doc.rect(margin, y, cW, rH, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(255, 255, 255);
      hdrs.forEach((h, i) => { doc.text(h, colX[i] + colW[i] / 2, y + 5.5, { align: 'center' }); });
      y += rH;
      (items.length ? items : [null]).forEach((item, idx) => {
        if (idx % 2 === 1) { doc.setFillColor(253, 250, 250); doc.rect(margin, y, cW, rH, 'F'); }
        doc.setDrawColor(210, 210, 210); doc.setLineWidth(0.25); doc.rect(margin, y, cW, rH, 'S');
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(30, 30, 30);
        if (!item) { doc.setTextColor(150, 150, 150); doc.text('No items found.', pageW / 2, y + 5.5, { align: 'center' }); }
        else {
          doc.text(String(idx + 1), colX[0] + colW[0] / 2, y + 5.5, { align: 'center' });
          doc.text(item.medicine_name || `Medicine #${item.medicine_id}`, colX[1] + 2, y + 5.5);
          doc.text(String(item.quantity), colX[2] + colW[2] / 2, y + 5.5, { align: 'center' });
          doc.text(item.unit || '—', colX[3] + colW[3] / 2, y + 5.5, { align: 'center' });
        }
        y += rH;
      });
      y += 14;
    }

    if (y > pageH - 62) { doc.addPage(); y = 22; }

    doc.setDrawColor(210, 210, 210); doc.setLineWidth(0.3);
    doc.line(margin, y - 4, pageW - margin, y - 4);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(123, 29, 30);
    doc.text('SIGNATORIES', margin, y + 2);
    y += 10;

    const sigs  = ['Requested by', 'Approved by', 'Issued by', 'Received by'];
    const sigW  = cW / 2;
    const lineL = sigW * 0.74;
    sigs.forEach((label, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const sx  = margin + col * sigW;
      const sy  = y + row * 28;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(90, 90, 90);
      doc.text(label + ':', sx, sy);
      doc.setDrawColor(80, 80, 80); doc.setLineWidth(0.3);
      doc.line(sx, sy + 13, sx + lineL, sy + 13);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(160, 160, 160);
      doc.text('Signature over Printed Name / Date', sx + lineL / 2, sy + 17, { align: 'center' });
    });

    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(190, 190, 190);
    doc.text(
      `MediTrack Clinic  ·  RIS #${r.id}  ·  Generated on ${new Date().toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' })}`,
      pageW / 2, pageH - 8, { align: 'center' }
    );

    doc.save(`RIS_${r.id}.pdf`);
    showToast('PDF Generated', `RIS #${r.id} exported successfully.`, 's');
  } catch {
    showToast('Error', 'Failed to generate PDF.', 'e');
  }
}


// ── Init ──────────────────────────────────────────────────────────────────────

loadRequests();

</script>
