<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediTrack | Settings</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../admin/main.css" />
  <style>
    .settings-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 22px;
      align-items: start;
    }
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 28px 22px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .profile-avatar-lg {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-light) 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem; font-weight: 800; color: var(--white);
      margin: 0 auto 16px;
      box-shadow: 0 6px 20px rgba(123,29,30,.28);
    }
    .profile-display-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.1rem; font-weight: 800;
      color: var(--text-1);
    }
    .profile-role-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 14px;
      background: rgba(123,29,30,.08);
      color: var(--maroon);
      border-radius: 20px;
      font-size: .75rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .6px;
    }
    .profile-joined {
      margin-top: 14px;
      font-size: .78rem;
      color: var(--text-3);
    }

    .settings-panels { display: flex; flex-direction: column; gap: 18px; }
    .settings-section {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 24px 22px;
      box-shadow: var(--shadow-sm);
    }
    .settings-section-title {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .98rem; font-weight: 800; color: var(--text-1);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-light);
    }
    .settings-section-title i { font-size: 1.1rem; color: var(--maroon); }

    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-row:last-child { margin-bottom: 0; }
    .form-label { font-size: .82rem; font-weight: 700; color: var(--text-2); }
    .form-input {
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .9rem;
      font-family: 'Nunito', sans-serif;
      color: var(--text-1);
      background: var(--bg);
      outline: none;
      transition: var(--transition);
    }
    .form-input:focus { border-color: var(--maroon); background: var(--white); box-shadow: 0 0 0 3px var(--maroon-glow); }
    .form-input:disabled { opacity: .55; cursor: not-allowed; }
    .form-hint { font-size: .75rem; color: var(--text-3); margin-top: 2px; }

    .btn-save {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 24px;
      background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-light) 100%);
      color: var(--white); border: none; border-radius: 10px;
      font-size: .9rem; font-weight: 700; font-family: 'Nunito', sans-serif;
      box-shadow: 0 4px 14px rgba(123,29,30,.28);
      cursor: pointer; transition: var(--transition);
    }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(123,29,30,.36); }
    .btn-save:active { transform: none; }


    @media (max-width: 900px) {
      .settings-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="../../js/auth.js"></script>
  <script>checkAuth('staff', '../../index.html');</script>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">

  <!-- SIDEBAR -->
  <div id="sidebarMount"></div>
  <!-- /sidebar -->


  <!-- TOP NAVBAR -->
  <header class="top-navbar" id="topNavbar">
    <div class="navbar-left">
      <button class="btn-menu-toggle" id="menuToggle" aria-label="Toggle Sidebar">
        <i class="bi bi-list"></i>
      </button>
      <div class="navbar-page-info">
        <div class="page-title">Settings</div>
        <div class="page-crumb">
          <i class="bi bi-house-fill" style="font-size:.68rem;"></i>
          &nbsp;Home &rsaquo; Settings
        </div>
      </div>
    </div>
    <div class="navbar-right">
      <div class="navbar-user" tabindex="0">
        <div class="user-avatar-nav user-avatar"></div>
        <div class="user-text">
          <span class="user-name-nav user-name"></span>
          <span class="user-role-nav user-role"></span>
        </div>
        
      </div>
    </div>
  </header>
  <!-- /top-navbar -->


  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">

    <div class="section-row au d1" style="margin-bottom:22px;">
      <div>
        <div class="sec-title">Account Settings</div>
        <div class="sec-sub">Manage your personal profile and preferences</div>
      </div>
    </div>

    <div class="settings-grid au d2">

      <!-- Profile Card -->
      <div class="profile-card">
        <div class="profile-avatar-lg user-avatar" id="profileAvatarLg"></div>
        <div class="profile-display-name user-name" id="profileDisplayName"></div>
        <div class="profile-role-badge">Clinic Staff</div>
        <div class="profile-joined" id="profileJoined"></div>
      </div>

      <div class="settings-panels">

        <!-- Profile Information -->
        <div class="settings-section">
          <div class="settings-section-title">
            <i class="bi bi-person-fill"></i>
            Profile Information
          </div>
          <div class="form-row">
            <label class="form-label" for="inputDisplayName">Display Name</label>
            <input type="text" class="form-input" id="inputDisplayName" placeholder="Enter your name…" />
          </div>
          <div class="form-row">
            <label class="form-label" for="inputUsername">Username</label>
            <input type="text" class="form-input" id="inputUsername" disabled />
            <span class="form-hint">Username cannot be changed.</span>
          </div>
          <div class="form-row">
            <label class="form-label" for="inputRole">Role</label>
            <input type="text" class="form-input" id="inputRole" value="Clinic Staff" disabled />
            <span class="form-hint">Role is assigned by the administrator and cannot be changed.</span>
          </div>
          <div style="margin-top:8px;">
            <button class="btn-save" id="btnSaveProfile">
              <i class="bi bi-check-lg"></i> Save Profile
            </button>
          </div>
        </div>

        <!-- Change Password -->
        <div class="settings-section">
          <div class="settings-section-title">
            <i class="bi bi-shield-lock-fill"></i>
            Change Password
          </div>
          <div class="form-row">
            <label class="form-label" for="inputCurrentPw">Current Password</label>
            <input type="password" class="form-input" id="inputCurrentPw" placeholder="Enter current password…" autocomplete="off" />
          </div>
          <div class="form-row">
            <label class="form-label" for="inputNewPw">New Password</label>
            <input type="password" class="form-input" id="inputNewPw" placeholder="Enter new password…" autocomplete="off" />
          </div>
          <div class="form-row">
            <label class="form-label" for="inputConfirmPw">Confirm New Password</label>
            <input type="password" class="form-input" id="inputConfirmPw" placeholder="Re-enter new password…" autocomplete="off" />
          </div>
          <div style="margin-top:8px;">
            <button class="btn-save" id="btnChangePassword">
              <i class="bi bi-key-fill"></i> Update Password
            </button>
          </div>
        </div>


      </div>
    </div>

  </main>
  <!-- /main-content -->

</div>
<!-- /app wrapper -->


<div class="toast-stack" id="toastStack"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="../sidebar.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/global.js"></script>
<script>
// Toast
function showToast(title, msg, type = 's') {
  const icons = { s:'bi-check-circle-fill', w:'bi-exclamation-circle-fill', e:'bi-x-circle-fill' };
  const stack = document.getElementById('toastStack');
  const el    = document.createElement('div');
  el.className = 'toast-item';
  el.innerHTML = `
    <div class="toast-ico ${type}"><i class="bi ${icons[type]}"></i></div>
    <div class="toast-body"><strong>${title}</strong><p>${msg}</p></div>
    <button class="toast-close" onclick="this.closest('.toast-item').remove()"><i class="bi bi-x"></i></button>
  `;
  stack.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 4000);
}

// Profile display
const storedUser = JSON.parse(localStorage.getItem('user') || 'null');
const displayName = storedUser ? (storedUser.name || storedUser.username || 'Staff') : 'Staff';
const avatarLetter = displayName.charAt(0).toUpperCase();
document.getElementById('profileDisplayName').textContent = displayName;
document.getElementById('profileAvatarLg').textContent    = avatarLetter;
document.getElementById('inputDisplayName').value         = displayName;
document.getElementById('profileJoined').textContent =
  'Member since ' + new Date().toLocaleDateString('en-PH', { month: 'long', year: 'numeric' });

document.getElementById('btnSaveProfile').addEventListener('click', () => {
  showToast('Profile Saved', 'Your display name has been updated.', 's');
});

document.getElementById('btnChangePassword').addEventListener('click', () => {
  showToast('Info', 'Password management is handled by the administrator.', 'w');
});

</script>
</body>
</html>
